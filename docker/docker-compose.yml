services:
  coordinator:
    image: ${CITUS_IMAGE:-citusdata/citus:14.2.0-pg16}
    container_name: citus_coordinator
    hostname: citus_coordinator
    ports:
      - "${COORDINATOR_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - citus-network

  worker-1:
    image: ${CITUS_IMAGE:-citusdata/citus:14.2.0-pg16}
    container_name: citus_worker_1
    hostname: citus_worker_1
    ports:
      - "${WORKER1_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - citus-network

  worker-2:
    image: ${CITUS_IMAGE:-citusdata/citus:14.2.0-pg16}
    container_name: citus_worker_2
    hostname: citus_worker_2
    ports:
      - "${WORKER2_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - citus-network

  # Worker 3 is available for rebalancing, scaling, and failover demonstrations
  worker-3:
    image: ${CITUS_IMAGE:-citusdata/citus:14.2.0-pg16}
    container_name: citus_worker_3
    hostname: citus_worker_3
    ports:
      - "${WORKER3_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - citus-network

  # PgBouncer connection pooler in front of coordinator
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p0
    container_name: citus_pgbouncer
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    environment:
      LISTEN_PORT: 6432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: citus_coordinator
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-postgres}
      AUTH_TYPE: plain
      POOL_MODE: session
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
    networks:
      - citus-network
    depends_on:
      coordinator:
        condition: service_healthy

networks:
  citus-network:
    name: citus-network
    driver: bridge
